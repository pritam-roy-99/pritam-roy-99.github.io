name: ScholarPath daily postdoctoral discovery
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'postdoc-tracker/scripts/discover.py'
      - '.github/workflows/scholarpath-discovery.yml'
concurrency:
  group: scholarpath-discovery-main
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect public recruitment leads
        run: python postdoc-tracker/scripts/discover.py --output postdoc-tracker/data/latest.json
      - name: Send opt-in topic digests through subscribed GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python postdoc-tracker/scripts/notify_issues.py
      - name: Publish feed safely even if other commits arrive
        shell: bash
        run: |
          set -euo pipefail
          cp postdoc-tracker/data/latest.json "$RUNNER_TEMP/scholarpath-latest.json"
          git config user.name 'scholarpath-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/scholarpath-latest.json" postdoc-tracker/data/latest.json
            git add postdoc-tracker/data/latest.json
            if git diff --cached --quiet; then
              echo 'No feed changes'
              exit 0
            fi
            git commit -m 'Update ScholarPath discovery feed'
            if git push origin HEAD:main; then
              echo 'Feed published'
              exit 0
            fi
            sleep 2
          done
          echo 'Could not publish after five attempts'
          exit 1
