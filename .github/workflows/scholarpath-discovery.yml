name: ScholarPath daily postdoctoral discovery
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'postdoc-tracker/scripts/discover.py'
      - '.github/workflows/scholarpath-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect public recruitment leads
        run: python postdoc-tracker/scripts/discover.py --output postdoc-tracker/data/latest.json
      - name: Publish changes only if the feed has changed
        run: |
          git config user.name 'scholarpath-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add postdoc-tracker/data/latest.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update ScholarPath discovery feed'
            git push
          fi
